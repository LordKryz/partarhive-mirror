name: Publish archive mirror
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Build static archive
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 30 'https://partarhive.vercel.app/ai/?section=places' -o /tmp/archive.html
          python3 - <<'PY'
          from pathlib import Path
          from html import escape, unescape
          import re
          root = Path('site')
          root.mkdir()
          (root / "BingSiteAuth.xml").write_text("<?xml version=\"1.0\"?>\n<users>\n\t<user>B5F4D9A601A1C95F6AA7E78CC716B7A5</user>\n</users>", encoding="utf-8")
          (root / "google701e8d2a11907aa9.html").write_text("google-site-verification: google701e8d2a11907aa9.html\n", encoding="utf-8")
          source = Path('/tmp/archive.html').read_text()
          origin = 'https://partarhive.vercel.app'
          base = 'https://lordkryz.github.io/partarhive-mirror/'
          items = []
          for slug, title, content in re.findall(r'<article id="([a-z0-9-]+)"><h2>(.*?)</h2>(.*?)</article>', source, re.S):
              url = origin + '/places/' + slug + '/'
              blocks = re.findall(r'<(p|h3)(?: class="article-text")?>([^<]*)</\1>', content, re.S)
              if not blocks:
                  raise ValueError('Empty article: ' + slug)
              body = ''.join(f'<{("h2" if tag == "h3" else tag)}>{escape(unescape(text))}</{("h2" if tag == "h3" else tag)}>' for tag, text in blocks)
              items.append((slug, unescape(title), url, body, '\n\n'.join(unescape(text) for _, text in blocks)))
          if not items or len({i[0] for i in items}) != len(items):
              raise ValueError('Missing or duplicate articles')
          def page(title, content, canonical=None):
              canon = f'<link rel="canonical" href="{escape(canonical)}">' if canonical else ''
              return f'<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{escape(title)}</title>{canon}<style>body{{max-width:50rem;margin:2rem auto;padding:0 1rem;font:1.1rem/1.6 system-ui;color:#192c24;background:#faf9f3}}p{{white-space:pre-wrap;overflow-wrap:anywhere}}li{{margin:.4rem 0}}a{{color:#145b44}}article{{border-top:1px solid #bbb;margin-top:2rem}}</style><main><h1>{escape(title)}</h1>{content}</main></html>'
          def write(name, content):
              (root / name).write_text(content, encoding='utf-8')
          def link(url, title):
              return f'<a href="{escape(url)}">{escape(title)}</a>'
          menu = '<p>' + ' · '.join([link('./', 'Оглавление'), link('all.html', 'Все тексты'), link('articles.txt', 'TXT'), link('books.html', 'Книги'), link(origin+'/', 'Основной сайт')]) + '</p>'
          toc = '<ol>' + ''.join('<li>'+link(slug+'.html', title)+'</li>' for slug,title,*_ in items) + '</ol>'
          write('index.html', page('Партенит | Цифровой архив', menu+f'<p>Текстовое зеркало. Статей: {len(items)}.</p>'+toc))
          combined = []
          for slug,title,url,body,plain in items:
              original = '<p>'+link(url, 'Оригинал статьи')+'</p>'
              write(slug+'.html', page(title, menu+original+body, url))
              combined.append(f'<article id="{slug}"><h2>{escape(title)}</h2>{original}{body}</article>')
          jumps = '<ol>' + ''.join('<li>'+link('#'+slug,title)+'</li>' for slug,title,*_ in items) + '</ol>'
          write('all.html', page('Все статьи о Партените', menu+jumps+''.join(combined)))
          write('articles.txt', '\n\n' .join(title+'\n'+url+'\n\n'+plain for _,title,url,_,plain in items))
          urls = ['', 'all.html'] + [i[0]+'.html' for i in items]
          import json
          from urllib.request import urlopen
          from time import sleep
          def fetch(path):
              for attempt in range(3):
                  try:
                      with urlopen(origin + path, timeout=30) as response:
                          return response.read()
                  except OSError:
                      if attempt == 2:
                          raise
                      sleep(2 ** attempt)
          books = json.loads(fetch('/books/index.json'))['books']
          if not books:
              raise ValueError('Empty book catalogue')
          book_links = []
          for book in books:
              original = book['read_url']
              match = re.fullmatch(re.escape(origin) + r'/books/(book-[a-f0-9-]+)/', original)
              if not match:
                  raise ValueError('Unexpected book URL: ' + original)
              slug = match[1]
              raw = fetch('/books/' + slug + '/text/')
              txt = raw.decode('utf-8-sig')
              marks = list(re.finditer(r'^## Страница (\d+)(?:[^\S\r\n]+\|[^\r\n]*)?[ \t]*\r?$', txt, re.M))
              numbers = [int(m[1]) for m in marks]
              if numbers != book['published_page_numbers'] or len(numbers) != book['published_page_count']:
                  raise ValueError(f'Printed page numbering does not match catalogue: {slug}; {numbers}')
              title = book['title']
              author = book['author']
              year = str(book['publication_year'])
              book_links.append('<li>' + link(slug+'.html', title) + f' — {escape(author)}, {escape(year)}; страниц в архиве: {len(numbers)}.</li>')
              (root / (slug + '.txt')).write_bytes(raw)
              intro = '<p>' + escape(txt[:marks[0].start()].strip()) + '</p>'
              nav = '<p>' + link(slug+'.txt', 'Скачать TXT') + ' · ' + link(original, 'Оригинал в архиве') + '</p>'
              contents = '<nav aria-label="Печатные страницы">' + ' · '.join(link(f'#page-{n}', str(n)) for n in numbers) + '</nav>'
              pages = []
              for idx, mark in enumerate(marks):
                  end = marks[idx+1].start() if idx+1 < len(marks) else len(txt)
                  heading = escape(mark[0].strip().removeprefix('## '))
                  paragraphs = ''.join('<p>' + escape(p) + '</p>' for p in re.split(r'\r?\n\s*\r?\n', txt[mark.end():end].strip()))
                  pages.append(f'<section id="page-{mark[1]}"><h2>{heading}</h2>{paragraphs}</section>')
              write(slug+'.html', page(title, menu+nav+intro+contents+''.join(pages), original))
              urls.append(slug+'.html')
              print(f'Exported {len(numbers)} printed pages: {title}')
          write('books.html', page('Краеведческие книги о Партените', menu+'<p>Оцифрованные материалы с печатной нумерацией. В архиве опубликованы фрагменты изданий.</p><ul>'+''.join(book_links)+'</ul>'))
          urls.append('books.html')
          write('sitemap.xml', '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'+''.join('<url><loc>'+base+u+'</loc></url>' for u in urls)+'</urlset>')
          print(f'Exported {len(items)} articles')
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
